name: CICD Pipeline
on: 
   push:
jobs:
   codes:
        uses: ./.github/workflows/codes.yml
   build:
        needs: codes
        uses: ./.github/workflows/build.yml
   test:
        needs: build
        uses: ./.github/workflows/test.yml
   deploy:
        needs: test
        uses: ./.github/workflows/deploy.yml
